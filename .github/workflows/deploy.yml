# Автотесты и публикация игры на GitHub Pages.
# Запускается при каждом изменении в ветке main (и вручную во вкладке Actions).
# Игра публикуется, только если все тесты прошли.
name: Тесты и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно идёт только одна публикация.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установка Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
          # Системные пакеты ставим отдельно: если серверы Ubuntu не отвечают, идём дальше —
          # на сборочной машине GitHub почти всё нужное уже есть.
          timeout 120 npx playwright install-deps chromium || echo "Пакеты Ubuntu недоступны — продолжаем без них"

      - name: Тест генератора уровней
        run: npm run test:gen

      - name: Тест игры в браузере
        run: npm run test:play

      - name: Скриншоты теста
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
          retention-days: 14

      - name: Сборка сайта
        run: |
          mkdir _site
          cp -r index.html css js _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Публикация
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
